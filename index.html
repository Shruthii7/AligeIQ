<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AligeIQ | Personal Finance Intelligence</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
    <div class="brand">
        <h1>AligeIQ</h1>
        <p>Understand your money. Make smarter decisions.</p>
    </div>

    <nav>
        <a href="#">Dashboard</a>
        <a href="#">Transactions</a>
        <a href="#">Budgets</a>
        <a href="#">Goals</a>
        <a href="#">Insights</a>
    </nav>
    </header>

    <main>
    <section class="dashboard">
        <div class="dashboard-heading">
            <h2>Financial Overview</h2>
            <p>Your financial snapshot at a glance.</p>
        </div>

        <div class="kpi-grid">
            <div class="card">
                <p>Total Income</p>
                <h3>₹0</h3>
            </div>

            <div class="card">
                <p>Total Expenses</p>
                <h3>₹0</h3>
            </div>

            <div class="card">
                <p>Current Balance</p>
                <h3>₹0</h3>
            </div>

            <div class="card">
                <p>Savings Rate</p>
                <h3>0%</h3>
            </div>
        </div>
    </section>
</main>

    <script src="script.js"></script>
</body>
</html>
